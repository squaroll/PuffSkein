<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PuffSkein</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main>
        <h1>PuffSkein</h1>

        <div id="chat">
            <div id="ai-response" aria-live="polite">
                有什么需要我帮忙的吗？
            </div>

            <form id="chat-form">
                <textarea
                    id="user-input"
                    aria-label="消息"
                    placeholder="请输入消息"
                    required
                ></textarea>

                <button id="send-button" type="submit">发送</button>
            </form>
        </div>    
        
        <div id="sidebar">
            <div id="clock">
                <span id="date"></span>
                <span id="time"></span>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
